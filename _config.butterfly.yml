# 导航栏
nav:
  logo: /images/head.jpg
  display_title: true
  fixed: false

# 文章 meta 信息显示
post_meta:
  page:
    date_type: created      
    date_format: date
    categories: true        
    tags: false             
    label: true
  post:
    date_type: both         
    date_format: date
    categories: true        
    tags: true            
    label: true

# 网站图标
favicon: /img/favicon.png

# 头像
avatar:
  img: /images/head.jpg
  effect: false        # 头像动画，建议关闭

# 顶部图
default_top_img: /img/banner.jpg
index_img: /img/banner.jpg
archive_img: /img/bg.jpg
tag_img: /img/bg.jpg
category_img: /img/bg.jpg

# 背景图
background: /img/bg.jpg

# 代码高亮
highlight_theme: mac

# 深色模式
darkmode:
  enable: true
  button: true
  autoChangeMode: 2

# 打字机效果
subtitle:
  enable: true
  loop: true
  source: false
  sub: 
    - 欢迎来到我的博客
    - 记录技术与生活

# 本地搜索
search:
  path: search.xml
  field: post
  content: true
  format: html

# 懒加载
lazyload:
  enable: true
  native: false
  field: site
  blur: true

# 字数统计
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true
